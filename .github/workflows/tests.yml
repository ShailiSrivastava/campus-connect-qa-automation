name: Campus Connect QA Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run API & UI Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Python QA Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Backend Server
        working-directory: backend
        env:
          PORT: 5000
          MONGO_URI: mongodb://localhost:27017/campusconnect
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'github_actions_ci_jwt_secret_123' }}
        run: |
          npm start &
          echo "Backend server started in background"

      - name: Start Frontend Server
        working-directory: frontend
        run: |
          npm run dev -- --port 5173 &
          echo "Frontend dev server started in background"

      - name: Wait for Services to be Ready
        run: |
          echo "Waiting for Backend (http://localhost:5000) and Frontend (http://localhost:5173)..."
          for i in {1..30}; do
            BACKEND_UP=0
            FRONTEND_UP=0
            curl -s http://localhost:5000/ > /dev/null && BACKEND_UP=1
            curl -s http://localhost:5173/ > /dev/null && FRONTEND_UP=1
            if [ $BACKEND_UP -eq 1 ] && [ $FRONTEND_UP -eq 1 ]; then
              echo "Both Backend and Frontend are online and ready!"
              break
            fi
            echo "Waiting for services... ($i/30)"
            sleep 2
          done

      - name: Run PyTest REST API Test Suite
        env:
          API_BASE_URL: http://localhost:5000
        run: |
          python -m pytest api_tests -v -m api

      - name: Run Selenium UI Test Suite
        env:
          API_BASE_URL: http://localhost:5000
          UI_BASE_URL: http://localhost:5173
          HEADLESS: "true"
        run: |
          python -m pytest ui_tests -v -m ui

      - name: Upload Test Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-failure-screenshots
          path: ui_tests/screenshots/
          if-no-files-found: ignore
